<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- Mobile responsive -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clean Notes App</title>

<style>

/* Reset default browser styles */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

/* Page background */
body{
  background:#f4f6fb;
  padding:20px;
}

/* Title style */
h1{
  text-align:center;
  margin-bottom:20px;
}

/* Top bar: search + add button */
.top-bar{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
  gap:10px;
}

/* Input fields */
input{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  width:100%;
}

/* Buttons */
button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#4e73df;
  color:white;
  transition:0.3s;
}

/* Button hover effect */
button:hover{
  opacity:0.8;
}

/* Notes grid layout */
.notes{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:15px;
}

/* Single note card */
.card{
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
  position:relative;
}

.card h3{
  margin-bottom:8px;
}

.card p{
  font-size:14px;
  margin-bottom:10px;
}

.card small{
  color:gray;
}

/* Edit/Delete buttons container */
.actions{
  margin-top:10px;
  display:flex;
  justify-content:space-between;
}

/* Delete button color */
.delete{
  background:#e74a3b;
}

/* Edit button color */
.edit{
  background:#f6c23e;
  color:black;
}

/* Modal background */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

/* Modal box */
.modal-content{
  background:white;
  padding:20px;
  border-radius:12px;
  width:300px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

</style>
</head>

<body>

<!-- App Title -->
<h1>My Notes</h1>

<!-- Search input + Add button -->
<div class="top-bar">
  <input type="text" id="search" placeholder="Search notes...">
  <button onclick="openModal()">+ Add</button>
</div>

<!-- Notes container -->
<div class="notes" id="notesContainer"></div>

<!-- Modal for adding/editing notes -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Add Note</h3>

    <!-- Note title -->
    <input type="text" id="title" placeholder="Title">

    <!-- Note description -->
    <textarea id="description" placeholder="Description" rows="4"></textarea>

    <!-- Save button -->
    <button onclick="saveNote()">Save</button>
  </div>
</div>

<script>

/* Get notes from localStorage
If empty create empty array */
let notes = JSON.parse(localStorage.getItem("notes")) || [];

/* Track note being edited */
let editIndex = null;

/* Render notes on screen */
function renderNotes(filter=""){

  const container = document.getElementById("notesContainer");
  container.innerHTML = "";

  notes
    // Filter notes using search input
    .filter(note => note.title.toLowerCase().includes(filter.toLowerCase()))

    /* Loop through notes(bug yar aya ku jira marka search la sameyo
  index markasta 0 */
    .forEach((note,index)=>{

      const card = document.createElement("div");
      card.className="card";

      // Create note card HTML
      card.innerHTML=`
        <h3>${note.title}</h3>
        <p>${note.description}</p>
        <small>${note.date}</small>

        <div class="actions">
          <button class="edit" onclick="editNote(${index})">Edit</button>
          <button class="delete" onclick="deleteNote(${index})">Delete</button>
        </div>
      `;

      container.appendChild(card);
    });
  /* marka bug laga saaro
  notes
.map((note,i)=>({note,i}))
.filter(obj => obj.note.title.toLowerCase().includes(filter.toLowerCase()))
.forEach((obj)=>{

const card = document.createElement("div");
card.className="card";

card.innerHTML=`
<h3>${obj.note.title}</h3>
<p>${obj.note.description}</p>
<small>${obj.note.date}</small>

<div class="actions">
<button class="edit" onclick="editNote(${obj.i})">Edit</button>
<button class="delete" onclick="deleteNote(${obj.i})">Delete</button>
</div>
`;

container.appendChild(card);

});*/
}

/* Open modal to add note */
function openModal(){

  document.getElementById("modal").style.display="flex";

  // Clear input fields
  document.getElementById("title").value="";
  document.getElementById("description").value="";

  // Change modal title
  document.getElementById("modalTitle").innerText="Add Note";

  editIndex=null;
}

/* Save note */
function saveNote(){

  const title=document.getElementById("title").value;
  const description=document.getElementById("description").value;

  // Validation
  if(!title || !description) return alert("Fill all fields!");

  // If new note
  if(editIndex===null){

    notes.push({
      title,
      description,
      date:new Date().toLocaleDateString()
    });

  }else{

    // Update existing note
    notes[editIndex].title=title;
    notes[editIndex].description=description;

  }

  // Save to localStorage
  localStorage.setItem("notes",JSON.stringify(notes));

  // Close modal
  document.getElementById("modal").style.display="none";

  // Re-render notes
  renderNotes();
}

/* Delete note */
function deleteNote(index){

  notes.splice(index,1);

  localStorage.setItem("notes",JSON.stringify(notes));

  renderNotes();
}

/* Edit note */
function editNote(index){

  openModal();

  document.getElementById("modalTitle").innerText="Edit Note";

  document.getElementById("title").value=notes[index].title;
  document.getElementById("description").value=notes[index].description;

  editIndex=index;
}

/* Search notes */
document.getElementById("search").addEventListener("input",function(){

  renderNotes(this.value);

});

/* Close modal when clicking outside */
window.onclick=function(e){

  if(e.target.id==="modal"){
    document.getElementById("modal").style.display="none";
  }

}

/* Run app first time */
renderNotes();

</script>

</body>
</html>
